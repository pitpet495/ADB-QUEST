<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ADB Quest</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9eef5;--pn:#fff;--fg:#14213a;--dim:#5d6b85;--ac:#3b4fd8;--ok:#0a7d4f;--er:#c0312b;--bd:#c9d3e4;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1220;--pn:#121a2e;--fg:#e6ecfa;--dim:#8d9bbb;--ac:#ffb454;--ok:#5fd7a0;--er:#ff7b72;--bd:#25314f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0c1220;--pn:#121a2e;--fg:#e6ecfa;--dim:#8d9bbb;--ac:#ffb454;--ok:#5fd7a0;--er:#ff7b72;--bd:#25314f;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.5 "JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;display:flex;justify-content:center}
#app{width:100%;max-width:720px;height:100%;display:flex;flex-direction:column;gap:10px;padding:12px}
header{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h1{font-size:18px;margin:0;font-weight:700}
#prog{color:var(--dim);font-size:12px}
#mission{background:var(--pn);border:1px solid var(--bd);border-left:4px solid var(--ac);border-radius:6px;padding:10px 12px}
#mission b{display:block}
#mission span{color:var(--dim)}
#term{flex:1;min-height:0;overflow-y:auto;background:var(--pn);border:1px solid var(--bd);border-radius:6px;padding:10px 12px}
#term div{white-space:pre-wrap;word-break:break-word}
.c{color:var(--ac)}.ok{color:var(--ok)}.er{color:var(--er)}.d{color:var(--dim)}
#row{display:flex;gap:8px;align-items:center;background:var(--pn);border:1px solid var(--bd);border-radius:6px;padding:0 10px}
#row:focus-within{border-color:var(--ac)}
#row i{color:var(--ac);font-style:normal}
input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--fg);font:inherit;padding:12px 0}
#chips{display:flex;gap:6px;flex-wrap:wrap}
button{font:inherit;font-size:12px;color:var(--fg);background:var(--pn);border:1px solid var(--bd);border-radius:999px;padding:5px 12px;cursor:pointer}
button:focus-visible{outline:2px solid var(--ac)}
</style></head>
<body><div id="app">
<header><h1>ADB Quest</h1><div id="prog"></div></header>
<div id="mission"></div>
<div id="term" aria-live="polite"></div>
<div id="chips"><button data-c="hint">hint</button><button data-c="help">help</button><button data-c="clear">clear</button><button data-c="adb devices">adb devices</button></div>
<div id="row"><i>$</i><input id="in" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="type an adb command" aria-label="command"></div>
</div>
<script>
const M=[
{t:"Find the phone",b:"A friend’s Pixel is acting haunted. Check that ADB can see it.",re:/^adb devices( -l)?$/,h:"adb devices",ok:"Device found and authorized."},
{t:"Spot the miner",b:"The battery is melting. List the installed packages and find the culprit.",re:/^adb shell pm list packages/,h:"adb shell pm list packages -3",ok:"There it is: com.coinminer.free."},
{t:"Evict it",b:"Remove the rogue app.",re:/^adb uninstall com\.coinminer\.free$/,h:"adb uninstall com.coinminer.free",ok:"Miner evicted. CPU is calming down."},
{t:"Read the logs",b:"The screen is locked and nobody remembers the PIN. Dump the log and look for it.",re:/^adb logcat/,h:"adb logcat -d | grep -i pin",ok:"A debug build leaked the PIN. Classic."},
{t:"Unlock it",b:"Type the PIN you found into the device.",re:/^adb shell input text 7319$/,h:"adb shell input text 7319",ok:"Unlocked."},
{t:"Save the evidence",b:"Something is in /sdcard/DCIM. Look around, then copy the evidence photo to your computer.",re:/^adb pull \/sdcard\/DCIM\/evidence\.png/,h:"adb shell ls /sdcard/DCIM, then adb pull /sdcard/DCIM/evidence.png",ok:"1 file pulled."},
{t:"Wipe the slate",b:"Reboot the phone into the bootloader so it can be reflashed clean.",re:/^adb reboot bootloader$/,h:"adb reboot bootloader",ok:"Rebooting. The phone is yours again."}];
const LOG=["11-01 09:12:03.114 I/ActivityManager( 612): Start proc com.coinminer.free","11-01 09:12:04.220 W/CPU( 987): coinminer.free using 94% CPU","11-01 09:13:10.002 D/PinKeeper( 455): debug build, lock pin=7319","11-01 09:13:11.870 E/WifiService( 301): scan failed, retrying","11-01 09:14:00.411 I/Keyguard( 455): device locked"];
let i,n,gone,hist=[],hp=0;
const T=document.getElementById("term"),IN=document.getElementById("in");
function say(s,c){const d=document.createElement("div");if(c)d.className=c;d.textContent=s;T.appendChild(d);T.scrollTop=T.scrollHeight}
function hud(){document.getElementById("prog").textContent=i<M.length?"mission "+(i+1)+" of "+M.length+" · "+n+" cmds":"complete · "+n+" cmds";
const m=document.getElementById("mission");m.innerHTML="";const b=document.createElement("b"),s=document.createElement("span");
if(i<M.length){b.textContent=M[i].t;s.textContent=M[i].b}else{b.textContent="Phone rescued";s.textContent="Solved in "+n+" commands. Type restart to play again."}
m.append(b,s)}
function start(){i=0;n=0;gone=false;T.innerHTML="";say("ADB Quest. Type real adb commands to fix the phone.","d");say("Try help if you’re stuck, hint for a nudge.","d");hud()}
function base(c){
if(c==="adb version")return"Android Debug Bridge version 1.0.41";
if(c==="adb devices"||c==="adb devices -l")return"List of devices attached\nR5CT1234XYZ\tdevice"+(c.endsWith("-l")?" product:husky model:Pixel_8_Pro":"");
if(/^adb shell pm list packages/.test(c)){let p=["com.android.chrome","com.android.settings","com.spotify.music"];if(!gone)p.splice(1,0,"com.coinminer.free");if(/-3/.test(c))p=p.filter(x=>!/settings/.test(x));return p.map(x=>"package:"+x).join("\n")}
if(/^adb uninstall /.test(c)){const k=c.split(" ")[2];if(k==="com.coinminer.free"&&!gone){gone=true;return"Success"}return"Failure [DELETE_FAILED_INTERNAL_ERROR]"}
if(/^adb logcat/.test(c))return LOG.filter(l=>!(gone&&/coinminer/.test(l))).join("\n");
if(/^adb shell input text/.test(c))return"";
if(c==="adb shell ls /sdcard/DCIM"||c==="adb shell ls /sdcard/DCIM/")return"cat.jpg\nevidence.png";
if(c==="adb shell ls /sdcard"||c==="adb shell ls /sdcard/")return"Alarms\nDCIM\nDownload\nMusic";
if(/^adb pull /.test(c))return/evidence\.png/.test(c)?"/sdcard/DCIM/evidence.png: 1 file pulled. 4.2 MB/s":"adb: error: failed to stat remote object";
if(c==="adb shell dumpsys battery")return"Current Battery Service state:\n  level: "+(gone?"71":"9")+"\n  temperature: "+(gone?"310":"482")+"\n  status: 3";
if(c==="adb shell getprop ro.build.version.release")return"14";
if(c==="adb shell whoami")return"shell";
if(/^adb shell screencap/.test(c))return"";
if(c==="adb reboot bootloader")return"";
if(c==="adb reboot")return"";
if(c==="adb shell")return"This sandbox runs one-shot commands. Add one, like: adb shell ls /sdcard";
if(c==="adb")return"Android Debug Bridge. Try: devices, shell, logcat, pull, push, uninstall, reboot";
return null}
function run(raw){
const c=raw.trim().replace(/\s+/g," ");if(!c)return;say("$ "+c,"c");hist.push(c);hp=hist.length;
if(c==="clear"){T.innerHTML="";return}
if(c==="restart"){start();return}
if(c==="help"){say("devices · shell pm list packages · uninstall <pkg> · logcat -d · shell input text <t> · shell ls <path> · pull <remote> · reboot bootloader\nPipe into grep to filter: adb logcat -d | grep -i pin","d");return}
if(c==="hint"){say(i<M.length?"Hint: "+M[i].h:"Nothing left to fix.","d");return}
const parts=c.split("|").map(s=>s.trim());let out=base(parts[0]);
if(out===null){say(/^adb/.test(c)?"adb: unknown command "+(c.split(" ")[1]||""):c.split(" ")[0]+": command not found","er");return}
const g=parts[1]&&parts[1].match(/^grep (-i )?(\S+)/);
if(g){const re=new RegExp(g[2].replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),g[1]?"i":"");out=out.split("\n").filter(l=>re.test(l)).join("\n")}
if(out)say(out);
n++;
if(i<M.length&&M[i].re.test(parts[0])){say("✓ "+M[i].ok,"ok");i++;if(i===M.length)say("All "+M.length+" missions done in "+n+" commands.","ok")}
hud()}
IN.addEventListener("keydown",e=>{
if(e.key==="Enter"){run(IN.value);IN.value=""}
else if(e.key==="ArrowUp"&&hp>0){hp--;IN.value=hist[hp];e.preventDefault()}
else if(e.key==="ArrowDown"){hp=Math.min(hp+1,hist.length);IN.value=hist[hp]||"";e.preventDefault()}});
document.getElementById("chips").addEventListener("click",e=>{const c=e.target.dataset.c;if(c){run(c);IN.focus()}});
start();
</script></body></html>
